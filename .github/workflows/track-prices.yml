name: Track SIN-LHR fares

on:
  schedule:
    # 01:00, 09:00, 17:00 UTC = 09:00, 17:00, 01:00 SGT.
    # 3 runs x 2 departure dates = ~180 searches a month (SerpApi free plan: 250).
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live fares from Google Flights (SerpApi)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DEPARTURE_DATES: '2027-01-16,2027-01-17'
          RETURN_DATE: '2027-06-05'
          FOCUS_DATE: '2027-01-17'
          ARRIVE_BY: '2027-01-18'
          PREFERRED_AIRLINE: 'SQ'
          PREFERRED_ALLOWANCE: '150'
        run: python3 scripts/fetch_prices.py

      # Runs even if the fetch failed, so the dashboard shows the failure instead of stale "ok".
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Fare check $(TZ=Asia/Singapore date '+%d %b %H:%M') SGT"
          git pull --rebase --autostash
          git push
